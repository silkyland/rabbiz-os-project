[package]
name = "osk-wayland"
description = "Wayland client for the rabbiz-osk keyboard: layer-shell surface, zwp_input_method_v2 text delivery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rabbiz-osk"
path = "src/main.rs"

[dependencies]
osk-core = { path = "../osk-core" }
osk-render = { path = "../osk-render" }
smithay-client-toolkit = "0.19"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
zbus = "5"
libc = "0.2"
