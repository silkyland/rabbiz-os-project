[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes/s2-render"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-segmentation = "1"
