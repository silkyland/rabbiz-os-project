[package]
name = "de-bin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
emu = ["de-core/emu", "de-system/emu"]

[dependencies]
de-core.workspace = true
de-backend.workspace = true
de-config.workspace = true
de-apps.workspace = true
de-system.workspace = true
libc.workspace = true
serde_json.workspace = true
zeroize.workspace = true
smithay.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "rabbiz-de"
path = "src/main.rs"

[[bin]]
name = "rabbiz-auth-helper"
path = "src/auth_helper.rs"
