# RabbizOS per-app launch overrides.
# Embedded at compile time via include_str!("../data/launch.toml").
#
# The shared app env contract lives in de-system/env.rs (single authority);
# [contract.env] here is only for app-launch–specific additions. Exact
# desktop-id match, no globs.

[overrides.google-chrome]
exec = "a21s-browser"
args = ["--disable-gpu"]

[overrides."com.google.Chrome"]
exec = "a21s-browser"
args = ["--disable-gpu"]

[overrides.chromium]
exec = "a21s-browser"
args = ["--disable-gpu"]
