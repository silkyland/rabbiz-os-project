[workspace]
resolver = "2"
members = [
    "crates/de-api",
    "crates/de-design",
    "crates/de-paint",
    "crates/de-ui",
    "crates/de-config",
    "crates/de-sim",
    "crates/de-apps",
    "crates/de-system",
    "crates/de-backend",
    "crates/de-render",
    "crates/de-protocols",
    "crates/de-core",
    "crates/de-bin",
    "tests/smoke",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
de-api = { path = "crates/de-api" }
de-design = { path = "crates/de-design" }
de-paint = { path = "crates/de-paint" }
de-ui = { path = "crates/de-ui" }
de-config = { path = "crates/de-config" }
de-sim = { path = "crates/de-sim" }
de-apps = { path = "crates/de-apps" }
de-system = { path = "crates/de-system" }
de-backend = { path = "crates/de-backend" }
de-render = { path = "crates/de-render" }
de-protocols = { path = "crates/de-protocols" }
de-core = { path = "crates/de-core" }

# Compositor framework: Linux-only crates depend on this.
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_egl",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "desktop",
    "wayland_frontend",
    "xwayland",
] }

# Paint/UI stack (host + device)
tiny-skia = "0.12"
cosmic-text = "0.12"
resvg = "0.50"
png = "0.18"

# System services
zbus = "5"
freedesktop-desktop-entry = "0.8"

# Host simulator
minifb = "0.27"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
getrandom = "0.3"

# Vendored smithay 0.7.0 with one upstream fix backported:
# `ShmBufferUserData::remove_destruction_hook` used `hook.id != hook_id` as the
# `position` predicate, so it removed the FIRST non-matching hook (or nothing
# when only one hook exists) instead of the requested one. The stale
# xdg-toplevel-icon buffer hook then posted `NoBuffer` and killed clients that
# destroy the icon before its buffer — Chrome's exact startup pattern
# (`findings/2026-11-21-layermap-mutex-self-deadlock.md` follow-up).
# Fixed upstream on main; drop this patch when the pin moves past 0.7.0.
[patch.crates-io]
smithay = { path = "vendor/smithay" }

[profile.release]
lto = "thin"
strip = "symbols"
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Raster/geometry code casts f32/i32/usize per-pixel by design — checked casts
# would drown the paint hot paths without adding safety.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# x/y/w/h/cx/cy are idiomatic in draw code.
many_single_char_names = "allow"
