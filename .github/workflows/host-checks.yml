name: host-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Seams, findings and app-logic tests (no Qt, no device)
        run: |
          set -e
          node scripts/check_shell_seams.mjs
          node scripts/check_findings.mjs
          node scripts/check_links.mjs
          for t in tests/findings.test.mjs tests/*.test.mjs shell/tests/*.test.mjs; do node "$t"; done
          python3 -B -m unittest discover -s tools/qt-scanout/tests
          python3 -B tests/test_holdmenu.py
          python3 -B tests/test_volume_keys.py
          python3 -B tests/test_rabbiz_splash.py
      - name: ShellCheck scripts and rootfs-overlay helpers
        run: |
          set -euo pipefail
          shellcheck -S warning scripts/*.sh scripts/release/*.sh devices/xiaomi/muyu/scripts/*.sh
          for f in rootfs-overlay/usr/local/bin/*; do
            [ -f "$f" ] || continue
            if head -n 1 "$f" | grep -qE '^#!.*(sh|bash)'; then
              shellcheck -S error "$f"
            fi
          done

  rabbiz-de:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rabbiz-de
    steps:
      - uses: actions/checkout@v4
      - name: Install native compositor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdrm-dev libgbm-dev libegl1-mesa-dev \
            libinput-dev libseat-dev libudev-dev libpixman-1-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libx11-dev libxcursor-dev libxcb1-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/rabbiz-de/target
          key: ${{ runner.os }}-rabbiz-de-${{ hashFiles('tools/rabbiz-de/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rabbiz-de-
      - name: Check crate seams
        run: python3 scripts/check_seams.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests (includes Phases 1-6 regressions)
        run: cargo test --locked --workspace
