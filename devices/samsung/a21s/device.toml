vendor   = "samsung"
codename = "a21s"
models   = ["SM-A217F"]
maintainers = ["silkyland"]

[soc]
name = "exynos850"              # S5E3830; shared drivers: socs/exynos850/drivers/

[display]
width_px  = 720
height_px = 1600
form_factor = "handset"

[boot]
method   = "uniLoader + AVB boot image (boot-avb.img)"
recovery = "devices/samsung/a21s/docs/a21s-boot-recovery.md"

[kernel]
version = "7.3.0"
defconfig = "devices/samsung/a21s/kernel/a21s_linux_defconfig"
patches = "devices/samsung/a21s/kernel/patches/"
dts = "exynos850-a217f.dts"

# Source: README.md hardware table (2026-11-18). Not re-verified by this change.
[status]
display = "working"
touch = "working"
gpu = "working"
usb = "working"
wifi = "working"
bluetooth = "working"
audio = "partial"
battery = "partial"
charger = "working"
backlight = "working"
thermal = "not-enabled"
sensors = "partial"
suspend = "untested"
modem = "planned"
