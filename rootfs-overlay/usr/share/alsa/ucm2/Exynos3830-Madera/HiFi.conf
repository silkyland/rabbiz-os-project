SectionVerb {

	EnableSequence [
	]

	DisableSequence [
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker (SMA1303)"

	EnableSequence [
		cset "name='SPK SPK On' on"
	]

	DisableSequence [
		cset "name='SPK SPK On' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},100"
	}
}
