# rabbiz-portals.conf — portal backend selection for RabbizOS
# (XDG_CURRENT_DESKTOP=Rabbiz). Deployed to
# /usr/share/xdg-desktop-portal/rabbiz-portals.conf; xdg-desktop-portal picks
# the file named <lowercase desktop>.conf at startup.
#
# GTK backend covers the interfaces third-party apps actually call on this DE:
# FileChooser (browser/GTK save dialogs), OpenURI, Settings (dark-mode
# propagation to GTK4/Electron via color-scheme), Inhibit, Wallpaper.
# Screenshot/ScreenCast are intentionally unset → the portal refuses those
# requests instead of capturing silently; the shell owns capture
# (rabbiz-screenshot / future consent dialog — DE-PRIVILEGED-PROTOCOLS §4E).
#
# Requires: xdg-desktop-portal + xdg-desktop-portal-gtk packages, plus the
# compositor's zxdg_foreign_v1 global for parent-window handles (landed in
# protocols/standards.rs, 2026-11-21).

[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.OpenURI=gtk
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.Wallpaper=gtk
