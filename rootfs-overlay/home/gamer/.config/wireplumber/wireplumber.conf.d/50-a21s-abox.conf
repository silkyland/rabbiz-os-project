monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.platform-samsung-abox.*"
      }
      {
        alsa.card_name = "abox_vdma"
      }
      {
        alsa.card_name = "abox_dump"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      {
        device.name = "~alsa_card.platform-sound.*"
      }
      {
        alsa.card_name = "Exynos3830-Madera"
      }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
        api.acp.auto-profile = false
        api.acp.auto-port = false
        api.alsa.use-ucm = true
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      }
      {
        node.name = "~alsa_input.platform-sound.*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        api.alsa.period-size = 960
        api.alsa.period-num = 4
        api.alsa.headroom = 0
        api.alsa.disable-mmap = true
        api.alsa.disable-tsched = true
      }
    }
  }
]
